<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<label for="name">Name</label>
	<input type="text" id="name" placeholder="Name" required>
	<br>

	<label for="email">Email</label>
	<input type="email" placeholder="Email" id="email" required>

	<!-- gender section u need to complete later  -->
	<br>

	<input type="radio" id="gender_m" name="gender" required>
	<label for="gender_m">male</label>
	<input type="radio" id="gender_f" name="gender" required>
	
	<label for="gender_f">female</label>
	<br>
	<select id="cars"  name="cars" placeholder="--Please choose an option--" required>
		<option value="BMW">BMW</option>
		<option value="Land Rover">Land Rover</option>
		<option value="Benz">Benz</option>
		<option value="Ferrari">Ferrari</option>
	</select>

	<br>
	<label for="age">Age</label>
	<input type="number" name="age" id="age" placeholder="Age" required>
	<br>
	<label for="dob">Enter Your date of Birth</label>
	<input type="date" id="dob" name="dob" required>
	
	<br>
	<br>
	<label for="tel">Phone Number</label>
	<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">
	<br>
	<label for="password">Password</label>
	<input type="password" id="password" placeholder="password" required>
	<br>
	<label for="tos">I agree to the TOS</label>
	<input type="checkbox" id="tos" required>
	 
	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
